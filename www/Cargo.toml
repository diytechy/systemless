[package]
name = "systemless-org"
version = "0.110.1"
edition = "2021"
rust-version = "1.93"
description = "Browser frontend for Systemless"
license = "GPL-3.0-or-later"
repository = "https://github.com/benletchford/systemless"
publish = false
default-run = "systemless-org"

[[bin]]
name = "systemless-org"
path = "src/main.rs"

[features]
# Slim three-game add-on build for OtterTube (docs/iterations/2026-11-11-ottertube-link).
# Off by default: the catalogue and private library builds are unchanged without it.
ottertube = ["dep:miniz_oxide"]

[dependencies]
base64 = "0.22"
gloo-net = { version = "0.6", features = ["http"] }
image = { version = "0.25", default-features = false, features = ["png"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
miniz_oxide = { version = "0.8", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
systemless = { path = "..", default-features = false }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "console",
    "OffscreenCanvas",
    "AbortController",
    "AbortSignal",
    "AddEventListenerOptions",
    "Document",
    "Element",
    "EventTarget",
    "CssStyleDeclaration",
    "Event",
    "File",
    "FileList",
    "DomRect",
    "History",
    "HtmlCanvasElement",
    "HtmlElement",
    "FocusOptions",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "CanvasRenderingContext2d",
    "ImageData",
    "WebGlBuffer",
    "WebGlProgram",
    "WebGlRenderingContext",
    "WebGlShader",
    "WebGlTexture",
    "WebGlUniformLocation",
    "MouseEvent",
    "MediaQueryList",
    "Navigator",
    "PointerEvent",
    "Touch",
    "TouchEvent",
    "TouchList",
    "KeyboardEvent",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "ReadableStreamReadResult",
    "Storage",
    "Performance",
    "AudioContext",
    "AudioContextOptions",
    "AudioContextLatencyCategory",
    "AudioContextState",
    "AudioWorklet",
    "AudioWorkletNode",
    "BaseAudioContext",
    "AudioBuffer",
    "AudioDestinationNode",
    "AudioProcessingEvent",
    "AudioNode",
    "MessagePort",
    "MessageEvent",
    "Worker",
    "ScriptProcessorNode",
    "Worklet",
    "Blob",
    "BlobPropertyBag",
    "DomStringList",
    "HtmlAnchorElement",
    "IdbDatabase",
    "IdbFactory",
    "IdbObjectStore",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbVersionChangeEvent",
    "Url",
] }

[dev-dependencies]
# The save text is unit-tested without the `ottertube` feature.
miniz_oxide = "0.8"

[build-dependencies]
systemless-catalogue-tools = { path = "tools/catalogue" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Browser compute workers run the same kernels as the desktop renderer.
systemless = { path = "..", version = "0.110.1", default-features = false, features = ["wgpu-compute"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu", "wgsl"] }
futures-channel = "0.3"
